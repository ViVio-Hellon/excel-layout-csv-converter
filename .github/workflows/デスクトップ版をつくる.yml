# デスクトップ版(Windows の .exe)をつくる
#
# 配る端末に Rust を入れる必要はありません。ここで作った
# ExcelCsvConverter.exe を、いつもどおりフォルダに入れて配ります。
#
# いつ動くか
#
#   main に押すたび     … いつでも最新の exe がある状態にします
#   v… のタグを押したとき … 配るぶん
#   手で実行            … Actions → この流れ → Run workflow
#
# 終わったら、その実行の画面の下の Artifacts から
# **ExcelCsvConverter-windows-<版>** を取ります ── exe だけでなく
# **配るフォルダまるごと**(画面・変換・設定・写しの日報管理ツール)が
# 入っています。新しい exe だけを古いフォルダへ入れると、窓は新しいのに
# 中身が古いままになります(画面には古い版が出ます)。
#
# Python は**同梱しません**(端末の Python を使います)。ここで作るのは
# 窓だけです。
name: デスクトップ版をつくる

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

# 同じブランチへ続けて押したときは、**前の実行を止めて最後のだけ**作ります
# (Windows のランナーは使った分が10倍で数えられるため)
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows の exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust を入れる
        uses: dtolnay/rust-toolchain@stable

      - name: 作ったものを覚えておく(次は速くなります)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 版がそろっているか・Rust の試験
        working-directory: src-tauri
        run: cargo test --locked

      - name: つくる
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: 版を控える
        shell: pwsh
        run: |
          $v = (Get-Content config/app.json -Raw | ConvertFrom-Json).version
          "版: $v" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      # **配るのはフォルダまるごと**です(exe 1つではありません)。
      #
      # 画面も変換も Python 側(app\ converter\ config\ vendor\)にあり、
      # 版の帯に出るのは config/app.json の版です。新しい exe だけを古い
      # フォルダへ入れると、窓は新しいのに中身は古いまま ── 画面には古い
      # 版が出ます(実際にそうなりました)。だから一式で出します。
      - name: 配るものを1つのフォルダにまとめる
        shell: pwsh
        run: |
          $dist = "dist/ExcelCsvConverter"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item src-tauri/target/release/ExcelCsvConverter.exe $dist
          foreach ($name in @("app", "converter", "config", "vendor", "docs")) {
            Copy-Item $name $dist -Recurse
          }
          foreach ($name in @("Start.vbs", "start.bat", "stop.bat",
                              "start_app.py", "bridge.py", "server.py",
                              "boot_server.py", "convert.py", "launch_guard.py",
                              "process_manager.py", "README.md",
                              "VENDOR.md", "requirements.txt")) {
            if (Test-Path $name) { Copy-Item $name $dist }
          }
          # 配った先に要らないもの(作業中の写し)は入れません
          Get-ChildItem $dist -Recurse -Directory -Filter "__pycache__" |
            Remove-Item -Recurse -Force
          "中身: " + ((Get-ChildItem $dist | Measure-Object).Count) + " 個" |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: 配るもの(フォルダまるごと)
        uses: actions/upload-artifact@v4
        with:
          name: ExcelCsvConverter-windows-${{ env.VERSION }}
          path: dist/ExcelCsvConverter
          if-no-files-found: error

      # exe だけ要るとき(中身を入れ替えずに窓だけ差し替える場合)。
      # **ふだんは上のフォルダのほうを使ってください**
      - name: exe だけ
        uses: actions/upload-artifact@v4
        with:
          name: ExcelCsvConverter-exe-only-${{ env.VERSION }}
          path: src-tauri/target/release/ExcelCsvConverter.exe
          if-no-files-found: error

  tests:
    name: Python の試験(業務のところ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 試験(追加ライブラリは入れません)
        run: python -m unittest discover -s tests -v
      - name: ポートを1つも開かずに通るか
        run: python scripts/ポート無しで通るか見る.py
