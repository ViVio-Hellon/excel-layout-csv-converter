<!DOCTYPE html>
<!--
  起動待機表示(基盤仕様書 2.2)

  【これは進捗率の画面ではありません】
  目的は「無反応に見える時間をなくすこと」と「失敗したときに次に何を見れば
  よいかを示すこと」です。だから段階は4つだけにしてあります。

  【秒数で完了扱いにしません】
  何秒経ったかではなく、**バックエンドの応答**を見て切り替えます。しかも
  応答すればよいのではなく、`app_id` が一致し `ready` が立ってからです ──
  同じポートを別のアプリが使っていても、誤って「起動した」と言わないため。

  このファイルは雛形です。起動時にポートとログの場所を埋めた写しが
  %LOCALAPPDATA%\…\runtime\loading.html へ書き出され、そちらが開かれます。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>{{APP_NAME}} を起動しています</title>
<style>
  :root {
    --bg: #0f1720; --panel: #172230; --line: #24344a;
    --text: #e8eef6; --dim: #93a4b8; --accent: #4da3ff; --warn: #ffb648;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; background: var(--bg); color: var(--text);
    font-family: "Yu Gothic UI", "Meiryo", sans-serif; padding: 24px;
  }
  .panel {
    width: min(560px, 100%); background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 28px 30px;
  }
  h1 { margin: 0 0 4px; font-size: 19px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 22px; }
  .stages { list-style: none; margin: 0 0 20px; padding: 0; }
  .stages li {
    display: flex; align-items: center; gap: 10px; padding: 7px 0;
    color: var(--dim); font-size: 14px;
  }
  .stages li.on { color: var(--text); }
  .stages li.done { color: var(--dim); }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: #2c3e56;
  }
  li.on .dot { background: var(--accent); animation: pulse 1.1s infinite; }
  li.done .dot { background: #2e7d5b; }
  @keyframes pulse { 50% { opacity: .35; } }
  .bar { height: 4px; background: #101a26; border-radius: 3px; overflow: hidden; }
  .bar span {
    display: block; height: 100%; width: 35%; background: var(--accent);
    animation: slide 1.5s ease-in-out infinite;
  }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .foot {
    display: flex; justify-content: space-between; margin-top: 16px;
    color: var(--dim); font-size: 12px;
  }
  .trouble {
    display: none; margin-top: 22px; padding: 16px; border-radius: 10px;
    background: #2a1f14; border: 1px solid #5a3f1d; font-size: 13px;
    line-height: 1.7;
  }
  .trouble.show { display: block; }
  .trouble b { color: var(--warn); }
  code {
    display: block; margin-top: 6px; padding: 8px 10px; background: #0d151f;
    border-radius: 6px; font-size: 12px; word-break: break-all;
  }
</style>
</head>
<body>
<div class="panel">
  <h1>{{APP_NAME}}</h1>
  <div class="sub">{{VERSION}} — 起動しています。しばらくお待ちください。</div>

  <ul class="stages">
    <li id="s1"><span class="dot"></span>実行環境を確認中</li>
    <li id="s2"><span class="dot"></span>アプリを準備中</li>
    <li id="s3"><span class="dot"></span>接続を確認中</li>
    <li id="s4"><span class="dot"></span>起動完了</li>
  </ul>

  <div class="bar"><span></span></div>
  <div class="foot">
    <span id="stage">実行環境を確認中</span>
    <span id="elapsed">0 秒</span>
  </div>

  <div class="trouble" id="trouble">
    <b id="trouble-title">時間がかかっています</b>
    <div id="trouble-body">
      まだ起動していません。しばらく待っても変わらない場合は、
      次のログを確認してください。
    </div>
    <code>{{LOG_DIR}}</code>
    <div style="margin-top:10px">
      それでも起動しない場合は <b>stop.bat</b> を実行してから、
      <b>start.bat</b>(診断用)で起動すると、コンソールに理由が出ます。
    </div>
  </div>
</div>

<script>
(function () {
  var BASE = "{{BASE_URL}}";
  var APP_ID = "{{APP_ID}}";
  var started = Date.now();
  var SLOW_MS = 45000;          // これを過ぎたら「見る場所」を出す
  var stages = ["s1", "s2", "s3", "s4"];

  function at(index, label) {
    stages.forEach(function (id, i) {
      var el = document.getElementById(id);
      el.className = i < index ? "done" : (i === index ? "on" : "");
    });
    document.getElementById("stage").textContent = label;
  }

  function trouble(title, body) {
    document.getElementById("trouble-title").textContent = title;
    if (body) { document.getElementById("trouble-body").textContent = body; }
    document.getElementById("trouble").className = "trouble show";
  }

  setInterval(function () {
    document.getElementById("elapsed").textContent =
      Math.floor((Date.now() - started) / 1000) + " 秒";
  }, 250);

  function poll() {
    fetch(BASE + "api/health", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (health) {
        if (health.app_id !== APP_ID) {
          // **応答したから起動した、とは言いません**(基盤仕様書 2.3)
          at(0, "別のアプリが応答しました");
          trouble("別のアプリが同じポートを使っています",
                  "応答したのは「" + (health.name || health.app_id) + "」でした。"
                  + "config/app.json の server.port を変えてください。");
          return setTimeout(poll, 2000);
        }
        if (health.ready) {
          at(3, "起動完了");
          return setTimeout(function () { location.replace(BASE); }, 250);
        }
        at(2, health.stage || "接続を確認中");
        setTimeout(poll, 400);
      })
      .catch(function () {
        var waited = Date.now() - started;
        at(waited < 4000 ? 0 : 1, waited < 4000 ? "実行環境を確認中" : "アプリを準備中");
        if (waited > SLOW_MS) {
          trouble("起動できていないかもしれません");
        }
        setTimeout(poll, 500);
      });
  }
  at(0, "実行環境を確認中");
  poll();
})();
</script>
</body>
</html>
